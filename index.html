<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>马克待办 MarkTodo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>马克待办</h1>
    <form id="todo-form" class="todo-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="今天要做什么？" maxlength="80" required>
      <button type="submit">添加</button>
    </form>
    <ul id="todo-list" class="todo-list"></ul>
    <p id="todo-empty" class="empty">还没有待办，先添加一条吧。</p>
    <button id="clear-done" class="clear-done" type="button">清除已完成</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
